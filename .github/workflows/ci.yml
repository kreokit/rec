# Tests on every push and pull request: Linux (everything, plus licence checks), macOS
# and Windows (frontend build + Rust tests, which also prove the app links on each
# platform). On Linux and Windows the recorder tests record the synthetic sources through
# our LGPL FFmpeg sidecar, the release encoders (src/encoder.rs).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux tests and licence checks
    # PipeWire 1.0 (cpal's PipeWire host needs 0.3.53 or newer).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux packages for Tauri, PipeWire, ALSA and V4L2 (bindgen needs clang), Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            librsvg2-dev libpipewire-0.3-dev libspa-0.2-dev \
            libasound2-dev clang libclang-dev xvfb
      - name: Our LGPL FFmpeg for the recorder and probe tests
        run: |
          python scripts/fetch_ffmpeg.py x86_64-unknown-linux-gnu
          echo "KREOKIT_FFMPEG=$PWD/src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
          echo "KREOKIT_FFPROBE=$PWD/src-tauri/binaries/ffprobe-x86_64-unknown-linux-gnu" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # Under Xvfb without a ScreenCast portal: the X11 screen through x11grab.
      - name: Rust tests (with the FFmpeg ones)
        working-directory: src-tauri
        run: xvfb-run -a -s "-screen 0 1280x720x24" cargo test --locked -- --include-ignored
      - name: The test version still builds
        working-directory: src-tauri
        run: cargo test --locked --features bench "bench::"
      - name: Rust dependency licences (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check licenses bans sources
      - name: THIRD-PARTY-LICENSES.md is up to date
        run: python scripts/third_party.py --check

  ffmpeg:
    name: LGPL FFmpeg sidecar (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_ffmpeg.py x86_64-unknown-linux-gnu
      - run: python scripts/verify_ffmpeg.py x86_64-unknown-linux-gnu

  desktop:
    name: ${{ matrix.name }} tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! embeds the built frontend.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # The recorder tests read their recordings back with ffmpeg (synthetic sources).
      - name: FFmpeg for the recorder tests
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Our LGPL FFmpeg for the recorder tests
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python scripts/fetch_ffmpeg.py x86_64-pc-windows-msvc
          echo 'KREOKIT_FFMPEG=${{ github.workspace }}\src-tauri\binaries\ffmpeg-x86_64-pc-windows-msvc.exe' >> "$GITHUB_ENV"
          echo 'KREOKIT_FFPROBE=${{ github.workspace }}\src-tauri\binaries\ffprobe-x86_64-pc-windows-msvc.exe' >> "$GITHUB_ENV"
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked
      # The runner's SDK is newer than macOS 12, as in release builds.
      - name: The app still runs on macOS 12 (weak links, minimum version)
        if: runner.os == 'macOS'
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          python3 scripts/check_macos_binary.py src-tauri/target/debug/rec
      # The test version (Tests screen, src/fieldtest.rs) builds on every system.
      - name: The test version still builds
        working-directory: src-tauri
        run: cargo test --locked --features bench "bench::"
      # The Windows/Linux recorder (src/pipeline.rs) on macOS too, through FFmpeg.
      - name: The Rust recorder's tests on macOS
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo test --locked --features pipe-recorder "native::"
      - name: An hour on the synthetic sources' clock (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --locked -- --ignored --exact native::tests::simulated_hour --nocapture
