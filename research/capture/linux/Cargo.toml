[package]
name = "lincap"
version = "0.0.0"
description = "M1 capture research: xdg-desktop-portal ScreenCast + PipeWire frame delivery, PulseAudio monitor capture"
license = "MIT OR Apache-2.0"
edition = "2024"
publish = false

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
pipewire = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
