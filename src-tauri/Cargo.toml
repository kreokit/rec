[package]
name = "rec"
version = "0.1.0"
description = "Free, offline screen and camera recorder. Part of KreoKit."
authors = ["KreoKit contributors"]
license = "MIT OR Apache-2.0"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rec_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Real-device measurements in test builds (src/bench.rs, native/macos/bench.m); never in
# releases.
bench = []
# Development: record with the Rust recorder (Windows/Linux, src/pipeline.rs) on macOS
# too, so its tests run on the dev Mac (`cargo test --features pipe-recorder`).
pipe-recorder = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiling the macOS recorder (native/macos, Objective-C).
cc = "1.9.0"

[dependencies]
# macos-private-api: the see-through region overlay (app.macOSPrivateApi).
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# The camera preview's pictures on Windows and Linux (src/preview.rs).
jpeg-encoder = "0.7.1"

# Free disk space before and during recording (statvfs); already in the tree through other crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[profile.dev]
opt-level = 1

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
