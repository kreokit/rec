[package]
name = "rec"
version = "0.1.0"
description = "Free, offline screen and camera recorder. Part of KreoKit."
authors = ["KreoKit contributors"]
license = "MIT OR Apache-2.0"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rec_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Real-device measurements in test builds (src/bench.rs, native/macos/bench.m); never in
# releases.
bench = []
# Development: record with the Rust recorder (Windows/Linux, src/pipeline.rs) on macOS
# too, so its tests run on the dev Mac (`cargo test --features pipe-recorder`).
pipe-recorder = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiling the macOS recorder (native/macos, Objective-C).
cc = "1.9.0"

[dependencies]
# macos-private-api: the see-through region overlay (app.macOSPrivateApi).
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Free disk space before and during recording (statvfs); already in the tree through other crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# Windows capture (src/native/win.rs): Windows.Graphics.Capture and DXGI duplication,
# Media Foundation cameras, WASAPI sound.
# Linux capture (src/native/linux.rs): the ScreenCast portal and PipeWire, V4L2 cameras,
# sound through cpal's PipeWire host. Needs libpipewire-0.3-dev, libasound2-dev and clang
# to build.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "screencast"] }
pipewire = "0.10.1"
v4l = "0.14.0"
cpal = { version = "0.18.2", features = ["pipewire"] }
tokio = { version = "1", features = ["rt", "time"] }

[target.'cfg(windows)'.dependencies]
windows-capture = "2.0.1"
cpal = "0.18.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
] }

[profile.dev]
opt-level = 1

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
